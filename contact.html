    <!-- Email Functionality -->
    <script>
      document.getElementById('contact-form').addEventListener('submit', function(event) {
        // event.preventDefault(); // Prevent form from submitting the default way
        document.querySelector('button[type="submit"]').disabled = true;
        console.log("debug1");

        // var nameElement = document.querySelector('input[name="name"]');
        // var emailElement = document.querySelector('input[name="email"]');
        // var companyElement = document.querySelector('input[name="company"]');
        // var telephoneElement = document.querySelector('input[name="telephone"]');
        // var aboutElement = document.querySelector('textarea[name="about"]');

        // console.log("Name Element: ", nameElement);
        // console.log("Email Element: ", emailElement);
        // console.log("Company Element: ", companyElement);
        // console.log("Telephone Element: ", telephoneElement);
        // console.log("About Element: ", aboutElement);

        // Collect the form data
        var name = document.querySelector('input[name="name"]').value || 'empty';
        var email = document.querySelector('input[name="email"]').value || 'empty';
        var company = document.querySelector('input[name="company"]').value || 'empty';
        var telephone = document.querySelector('input[name="telephone"]').value || 'empty';
        var about = document.querySelector('textarea[name="about"]').value || 'empty';

        console.log("debug2");
        console.log("name: " + name);
        console.log("email: " + email);
        console.log("comp: " + company);
        console.log("tel: " + telephone);
        console.log("about: " + about);

        // Collect the service checkboxes
        var services = [];
        document.querySelectorAll('.form-check-input-custom:checked').forEach(function(checkbox) {
            services.push(checkbox.nextElementSibling.innerText);
        });
        services = services.length > 0 ? services.join(', ') : 'empty';

        console.log("debug3");
        console.log("services: " + services);

        // Send email using EmailJS
        emailjs.send("service_bejs19r","template_phbdmyb",{
          folio_name: "Vanessa's Portfolio",
          name: name,
          email: email,
          company: company,
          phone: telephone,
          service: services,
          message: about,
        }).then(function(response) {
          document.getElementById('contact-form').reset();
          document.querySelector('button[type="submit"]').disabled = false; // Re-enable button
          console.log("debug4: success" + response.json);
          alert('Message sent successfully!');
        }, function(error) {
          document.querySelector('button[type="submit"]').disabled = false; // Re-enable button
          console.log("debug5: failure: " + error);
          console.log(error.json);
          alert('Failed to send message. Please try again.');
        });
      });
  </script>
